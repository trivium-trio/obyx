name: Deploy Frontend to Vercel

# ─────────────────────────────────────────────────────────────
# Deploys apps/web to Vercel via CLI when changes hit main.
# 
# Required GitHub Secrets:
#   VERCEL_TOKEN       — Generate at https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — From `vercel link` → .vercel/project.json
#   VERCEL_PROJECT_ID  — From `vercel link` → .vercel/project.json
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main,develop,production]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'

  # Allow manual trigger for initial setup / hotfixes
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # --- STEPS FOR PREVIEW BRANCHES (develop, production) ---
      - name: Pull Vercel environment (Preview)
        if: github.ref != 'refs/heads/main'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project (Preview)
        if: github.ref != 'refs/heads/main'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Preview
        if: github.ref != 'refs/heads/main'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      # --- STEPS FOR MAIN BRANCH (Live Production) ---
      - name: Pull Vercel environment (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}